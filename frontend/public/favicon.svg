<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142436"/>
      <stop offset="100%" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd978"/>
      <stop offset="50%" stop-color="#e5b94c"/>
      <stop offset="100%" stop-color="#c69628"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Stylized MM Monogram -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- First 'M' -->
    <path d="M12 45 L12 21 L18.5 21 L24 33 L29.5 21 L36 21 L36 45 L30.5 45 L30.5 30 L25.5 40 L22.5 40 L17.5 30 L17.5 45 Z" 
          transform="translate(-1, 0) scale(0.95)" transform-origin="24 33"/>
    <!-- Second 'M' offset/blended -->
    <path d="M28 45 L28 21 L34.5 21 L40 33 L45.5 21 L52 21 L52 45 L46.5 45 L46.5 30 L41.5 40 L38.5 40 L33.5 30 L33.5 45 Z" 
          transform="translate(4, 0) scale(0.95)" transform-origin="40 33"/>
  </g>

  <!-- Speed Wing / Underline Accent -->
  <path d="M14 49 L50 49" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
